[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "classiq-gaussian-state-preparation"
version = "0.1.0"
description = "Recursive pruned Gaussian state-preparation for Classiq"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "classiq",
  "numpy>=1.24.0",
  "matplotlib>=3.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
